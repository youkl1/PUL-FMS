<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PUL-FMS 图纸浏览 · 业务流程图与 UML 图</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",system-ui,sans-serif; height:100vh; display:flex; overflow:hidden; background:#f6f8fb; }
  #side { width:280px; min-width:280px; background:#182433; color:#dbe2ea; display:flex; flex-direction:column; }
  #side h1 { font-size:15px; padding:16px; color:#fff; border-bottom:1px solid rgba(255,255,255,.1); }
  #side h1 small { display:block; font-size:11.5px; color:#8a97a8; margin-top:4px; font-weight:400; }
  #list { flex:1; overflow-y:auto; padding:8px; }
  .item { padding:9px 12px; border-radius:6px; cursor:pointer; font-size:13px; line-height:1.5; color:#b8c2ce; }
  .item:hover { background:rgba(255,255,255,.06); }
  .item.active { background:#206bc4; color:#fff; }
  .item .no { display:inline-block; min-width:26px; color:#8a97a8; font-family:Consolas,monospace; }
  .item.active .no { color:#bcd6f5; }
  .item .case { display:block; font-size:11px; color:#7c8b9d; padding-left:26px; line-height:1.4; }
  .item.active .case { color:#bcd6f5; }
  .grp { font-size:11px; color:#6b7a8d; padding:12px 12px 4px; letter-spacing:1px; }
  #main { flex:1; display:flex; flex-direction:column; }
  #bar { height:48px; background:#fff; border-bottom:1px solid #e3e8ee; display:flex; align-items:center; gap:8px; padding:0 16px; }
  #bar .title { font-size:14px; font-weight:600; color:#182433; }
  #bar .sp { flex:1; }
  #bar button { border:1px solid #d4dbe3; background:#fff; border-radius:6px; padding:5px 12px; font-size:13px; cursor:pointer; color:#182433; }
  #bar button:hover { background:#f0f4f8; }
  #zoomPct { font-size:12.5px; color:#626976; min-width:44px; text-align:center; }
  #view { flex:1; overflow:hidden; position:relative; cursor:grab; }
  #view.drag { cursor:grabbing; }
  #canvas { position:absolute; transform-origin:0 0; padding:24px; background:#fff; }
  #canvas svg { display:block; }
  #hint { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; color:#874d00; font-size:14px; line-height:2; background:#fff7e6; padding:40px; }
  code { background:#eef1f5; padding:1px 6px; border-radius:4px; font-family:Consolas,monospace; }
</style>
</head>
<body>
  <div id="side">
    <h1>PUL-FMS 图纸<small>业务流程图 × UML · 共 21 张 + 1 份实例 · 按业务模块分组（对齐系统菜单）</small></h1>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="bar">
      <span class="title" id="title"></span>
      <span class="sp"></span>
      <button id="zoomOut">−</button>
      <span id="zoomPct">100%</span>
      <button id="zoomIn">＋</button>
      <button id="zoomFit">适应窗口</button>
    </div>
    <div id="view">
      <div id="canvas"></div>
      <div id="hint">图纸加载失败：文件缺失或无法读取<br>若直接双击打开（file://），建议在本目录起服务获得完整体验：<code>python -m http.server 9991</code> 然后访问 <code>http://localhost:9991</code></div>
    </div>
  </div>
<script>
var DIAGRAMS = [
  { grp: '总览' },
  { f: '01-lifecycle',   t: '药品全生命周期总览', c: '一盒药从供应商到患者的 6 站旅程（台账管理同用）' },
  { grp: '系统管理' },
  { f: '10-permission',  t: '权限模型 + 登录上下文', c: 'admin 看全部院区，院区管理员只看本院区' },
  { f: '05-manual-ops',  t: '人工后台维护入口总览', c: '6 类人工入口：设备/扫码挂了业务照样跑' },
  { grp: '基础管理' },
  { f: '07-conversion',  t: '码⇄药⇄单位 全链路转换', c: '1箱=60盒、1盒=7片；基本单位在药品字典不在码上' },
  { f: '13-code-flow',   t: '箱码全链路 · 码怎么转', c: '60个一级盒码：到货→入库→领用2盒→拆零发2片' },
  { f: '13-box-instance', t: '箱码实例 · 表存储模拟数据', page: '13-box-instance.html', c: '阿莫西林60盒：五张表在五时刻长什么样' },
  { grp: '采购管理' },
  { f: '02-purchase-in', t: '采购到货入库（到货单一页走完）', c: '平台自动拉取/手动新增 · 拉取即解析（点下载可再解析）→ 扫码匹配或免扫码人工验收 → 审核即生成入库单；异常码补录不卡单 · 反审核可撤回' },
  { f: '17-purchase-state-machine', t: '采购到货单 · 进度状态机', c: '一维生命周期两态 + 反审核回路；扫码核对不占状态位，审核须全部码解析成功' },
  { grp: '库房管理' },
  { f: '23-pick-unified-state-machine', t: '领用单 · 全链统一状态机', c: '一套单据五态走全程：待提交→待出库→已出库·待入库→已入库·待上架→已上架；三入口 + 捷径「药房扫码直生已审核单」；一套四表全程复用（药房管理同用；原图18/19 已并入本图）' },
  { f: '15-pick-in-loop-seq', dir: 'mermaid', t: '领用出库→入库闭环（时序图）', c: 'Mermaid sequence：申请→备货→审核扣账→在途→核对入库，含两入口等价说明' },
  { f: '08-stock-derivation', t: '库存推导（集合加减法）', c: '在架库存=入库集合−出库集合，不靠快照（药房管理同用）' },
  { grp: '药房管理' },
  { f: '24-ph-full-loop', t: '药房管理 · 全流程泳道图', c: '三泳道长画布全直线：申请→备货→审核出库→审核入库→上架→在架 + 捷径扫码直生 + 逆向下架/退回/报损（原图03/21 已并入本图；报损详见图22）' },
  { f: '20-ph-ret-state-machine', t: '退回出库单 · 进度状态机', c: '一维生命周期三态 + 撤销回路；未出库草稿不扣账，确认出库即扣药房在架（与领用状态机对偶）' },
  { f: '22-ph-loss-state-machine', t: '药房损耗（报损）· 进度状态机', c: '未审核 → 已审核=已销毁终态；审核即扣本房在架不可恢复，不碰库房损耗单' },
  { grp: '出库管理' },
  { f: '04-dispensing',  t: '门诊发药（三模式 · 当场降级 · 逆向）', c: '边扫边拿 / 窗口先抓后扫 / 药柜预设 · 拆零先拆后配（规则匹配 · 余量转拆零区盒不留）· 异常当场补绑不卡流程' },
  { f: '04b-inpatient-dispensing', t: '住院摆药（先拿后匹配 · 事后补绑 · 逆向）', c: '摆药单驱动先拿药 · 规则匹配偏差=默认出口（命中/偏差都出库）· 台账日结闭环 · 与04共用台账' },
  { grp: '盘点管理' },
  { f: '14-stocktake',   t: '盘点流程（期初→盘点→盈亏）', c: '账面5片实数4片：盘亏1片出库；码损走无码记录' },
  { grp: '机制与数据（技术）' },
  { f: '06-data-model',  t: '数据模型 ER（概念总览）', c: '' },
  { f: '12-er-fields',   t: '表结构 ER（关系版 · 核心七表）', c: '只列主外键+表作用；含 STOCK_BALANCE 派生视图与 SCAN_LOG【规划】；字段级见 er/pul-fms-full.sql' },
  { f: '16-er-core', dir: 'mermaid', t: '表结构 ER（轻量草图 · Mermaid）', c: '与图12同口径；DrawDB 美化的离线对照，DDL 见 er/pul-fms-core.sql' },
  { f: '09-state-machine', t: '状态机（场景式 · 码 × 单据）', c: '一个码的一生：8 场景 × 每列三问（码怎么变→哪张单据驱动→库存怎么动）+ 守恒总账' },
  { f: '11-usecase',     t: '用例图（按角色）', c: '' }
];
var zoom = 1, panX = 0, panY = 0, isPage = false, seq = 0;
var canvas = document.getElementById('canvas'), view = document.getElementById('view');

function apply() {
  canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
  document.getElementById('zoomPct').textContent = Math.round(zoom * 100) + '%';
}
function fit() {
  var w, h;
  var svg = canvas.querySelector('svg');
  if (svg) {
    w = svg.viewBox ? svg.viewBox.baseVal.width : svg.getBBox().width;
    h = svg.viewBox ? svg.viewBox.baseVal.height : svg.getBBox().height;
  } else {
    var img = canvas.querySelector('img');
    if (!img || !img.naturalWidth) return;
    w = img.naturalWidth; h = img.naturalHeight;
  }
  var vw = view.clientWidth, vh = view.clientHeight;
  zoom = Math.min(vw / (w + 60), vh / (h + 60), 3);
  panX = (vw - w * zoom) / 2; panY = (vh - h * zoom) / 2;
  apply();
}
async function show(idx) {
  var d = DIAGRAMS[idx]; if (!d || !d.f) return;
  var mySeq = ++seq;   // 序号防串：快速切换时，慢响应不得覆盖新图纸
  Object.keys(itemEls).forEach(function (k) { itemEls[k].classList.toggle('active', Number(k) === idx); });
  document.getElementById('title').textContent = d.f + ' · ' + d.t;
  history.replaceState(null, '', '#' + d.f.slice(0, 2));
  var zoomEls = document.querySelectorAll('#zoomOut, #zoomIn, #zoomFit, #zoomPct');
  var hint = document.getElementById('hint');
  if (d.page) {
    isPage = true;
    zoomEls.forEach(function (el) { el.style.display = 'none'; });
    view.style.cursor = 'default';
    canvas.style.transform = 'none';
    canvas.style.padding = '0';
    canvas.style.width = '100%';
    canvas.innerHTML = '<iframe src="' + d.page + '?embed=1" style="width:100%;height:' + view.clientHeight + 'px;border:0;display:block;"></iframe>';
    hint.style.display = 'none';
    return;
  }
  isPage = false;
  zoomEls.forEach(function (el) { el.style.display = ''; });
  view.style.cursor = 'grab';
  canvas.style.padding = '24px';
  canvas.style.width = '';
  var url = (d.dir || 'fireworks') + '/' + d.f + '.svg';
  try {
    var res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var txt = await res.text();
    if (mySeq !== seq) return;
    canvas.innerHTML = txt;
    hint.style.display = 'none';
    zoom = 1; panX = 0; panY = 0; fit();
  } catch (e) {
    loadImg(url, mySeq);   // file:// 下 fetch 必被拦截，回退 <img>（不受限）
  }
}
// 回退渲染：fetch 失败时用 <img> 直接读 SVG，缩放/拖拽照常；img 也失败才亮提示
function loadImg(url, mySeq) {
  var img = new Image();
  img.draggable = false;
  img.onload = function () {
    if (mySeq !== seq) return;
    canvas.innerHTML = '';
    img.style.display = 'block';
    canvas.appendChild(img);
    document.getElementById('hint').style.display = 'none';
    zoom = 1; panX = 0; panY = 0; fit();
  };
  img.onerror = function () {
    if (mySeq !== seq) return;
    document.getElementById('hint').style.display = 'flex';
  };
  img.src = url;
}
// 侧栏清单（itemEls 记录「图序号 → 元素」映射，grp 行不占位）
var list = document.getElementById('list');
var itemEls = {};
DIAGRAMS.forEach(function (d, i) {
  if (d.grp) { var g = document.createElement('div'); g.className = 'grp'; g.textContent = d.grp; list.appendChild(g); return; }
  var el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = '<span class="no">' + d.f.slice(0, 2) + '</span>' + d.t +
    (d.c ? '<span class="case">' + d.c + '</span>' : '');
  el.onclick = function () { show(i); };
  list.appendChild(el);
  itemEls[i] = el;
});
// 缩放 / 拖拽
document.getElementById('zoomIn').onclick = function () { zoom = Math.min(zoom * 1.25, 4); apply(); };
document.getElementById('zoomOut').onclick = function () { zoom = Math.max(zoom / 1.25, 0.2); apply(); };
document.getElementById('zoomFit').onclick = fit;
view.addEventListener('wheel', function (e) {
  if (isPage) return;
  e.preventDefault(); zoom = Math.min(Math.max(zoom * (e.deltaY < 0 ? 1.1 : 0.9), 0.2), 4); apply();
}, { passive: false });
var drag = null;
view.addEventListener('mousedown', function (e) {
  if (isPage) return;
  drag = { x: e.clientX - panX, y: e.clientY - panY }; view.classList.add('drag');
});
window.addEventListener('mousemove', function (e) { if (drag) { panX = e.clientX - drag.x; panY = e.clientY - drag.y; apply(); } });
window.addEventListener('mouseup', function () { drag = null; view.classList.remove('drag'); });
// 初始打开：支持 #01 深链
var initIdx = 1;
var m = (location.hash || '').match(/^#(\d{2})$/);
if (m) DIAGRAMS.forEach(function (d, i) { if (d.f && d.f.slice(0, 2) === m[1]) initIdx = i; });
show(initIdx);
</script>
</body>
</html>
