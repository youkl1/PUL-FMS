<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>verify</title></head>
<body>
<pre id="out">PENDING</pre>
<script src="vendor/mermaid.min.js"></script>
<script>
var FILES = ['01-lifecycle.mmd','02-purchase-in.mmd','03-pick-loop.mmd','04-dispensing.mmd','05-manual-ops.mmd','06-data-model.mmd','07-conversion.mmd','08-stock-derivation.mmd','09-state-machine.mmd','10-permission.mmd','11-usecase.mmd'];
mermaid.initialize({ startOnLoad: false });
(async function () {
  var lines = [];
  for (var i = 0; i < FILES.length; i++) {
    var f = FILES[i];
    try {
      var txt = await (await fetch(f)).text();
      var r = await mermaid.parse(txt);
      lines.push('OK   ' + f);
    } catch (e) {
      lines.push('FAIL ' + f + ' :: ' + (e && e.message ? e.message.split('\n')[0] : e));
    }
  }
  document.getElementById('out').textContent = 'DONE\n' + lines.join('\n');
})();
</script>
</body>
</html>
